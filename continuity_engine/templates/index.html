<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Continuity Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #16161f;
      --border: #1e1e2e;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --text-muted: #6b6b80;
      --text-dim: #3a3a50;
      --memory: #1a1a2e;
      --memory-border: #2a2a4a;
      --emotion-neutral: #4a4a6a;
      --emotion-stress: #7f3a3a;
      --emotion-excitement: #3a6a4a;
      --emotion-doubt: #5a5a3a;
      --emotion-motivation: #3a4a6a;
      --emotion-frustration: #7a4a3a;
      --radius: 14px;
      --radius-sm: 8px;
      --sidebar-w: 260px;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ── ROOT LAYOUT ── */
    .app {
      display: flex;
      height: 100dvh;
      width: 100%;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.25s ease, opacity 0.25s ease;
    }

    .sidebar.collapsed {
      width: 0;
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-header {
      padding: 18px 20px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 300;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .btn-row {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }

    .new-chat-btn, .clear-btn {
      flex: 1;
      padding: 7px 0;
      background: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .new-chat-btn {
      border: 1px solid #1e2a1e;
      color: #4a7a4a;
    }

    .new-chat-btn:hover { background: #0a1a0a; border-color: #3a6a3a; color: #7acc7a; }
    .new-chat-btn:active { transform: scale(0.97); }

    .clear-btn {
      border: 1px solid #3a1a1a;
      color: #7a4040;
    }

    .clear-btn:hover { background: #1a0a0a; border-color: #7a3030; color: #cc6060; }
    .clear-btn:active { transform: scale(0.97); }

    /* scrollable sidebar body */
    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .sidebar-body::-webkit-scrollbar { width: 3px; }
    .sidebar-body::-webkit-scrollbar-thumb { background: var(--border); }

    .sidebar-section {
      padding: 16px 20px 0;
    }

    .context-section {
      padding: 16px 20px 20px;
      margin-top: auto;
      border-top: 1px solid var(--border);
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
      font-family: 'Syne', sans-serif;
    }

    #summary-container {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-bottom: 16px;
    }

    .summary-item {
      background: var(--memory);
      border: 1px solid var(--memory-border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
      transition: border-color 0.2s;
      animation: fadeSlideIn 0.4s ease forwards;
    }

    .summary-item:hover { border-color: var(--accent); color: var(--text); }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .empty-summary {
      font-size: 11px;
      color: var(--text-dim);
      font-style: italic;
    }

    #context-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .context-item {
      background: var(--surface2);
      border-left: 2px solid var(--text-dim);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 7px 9px;
      font-size: 10px;
      color: var(--text-muted);
      animation: fadeSlideIn 0.3s ease forwards;
      transition: border-color 0.2s;
    }

    .context-item[data-importance="high"] { border-left-color: var(--accent); }
    .context-item[data-importance="mid"] { border-left-color: #4a6a7a; }

    .context-meta {
      display: flex;
      gap: 5px;
      margin-bottom: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--border);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .tag.role-user { background: #1a2030; color: #6a8aaa; }
    .tag.role-assistant { background: #1a1a30; color: #8a7aaa; }
    .tag.emotion-stress { background: var(--emotion-stress); color: #ffaaaa; }
    .tag.emotion-excitement { background: var(--emotion-excitement); color: #aaffaa; }
    .tag.emotion-doubt { background: var(--emotion-doubt); color: #ffffaa; }
    .tag.emotion-motivation { background: var(--emotion-motivation); color: #aaaaff; }
    .tag.emotion-frustration { background: var(--emotion-frustration); color: #ffccaa; }
    .tag.emotion-neutral { background: var(--emotion-neutral); color: var(--text-muted); }

    .context-content {
      font-size: 10px;
      color: var(--text-muted);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* ── MAIN AREA ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ── TOPBAR ── */
    .topbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      flex-shrink: 0;
    }

    .toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .toggle-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }

    .topbar-title {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      min-width: 0;
    }

    .memory-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--text-muted);
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface2);
      transition: all 0.3s ease;
      cursor: default;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .memory-indicator.loading { color: var(--accent2); border-color: var(--accent); background: rgba(124,106,247,0.08); }
    .memory-indicator.done { color: #6aaa8a; border-color: #2a4a3a; background: rgba(106,170,138,0.08); }

    .memory-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .memory-indicator.loading .memory-dot { background: var(--accent); animation: memPulse 0.8s ease-in-out infinite; }
    .memory-indicator.done .memory-dot { background: #6aaa8a; animation: none; }

    @keyframes memPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      min-height: 0;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message {
      display: flex;
      gap: 12px;
      animation: msgIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      width: 100%;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .avatar.user-av {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
    }

    .avatar.ai-av {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .msg-body { display: flex; flex-direction: column; max-width: 72%; min-width: 0; }
    .message.user .msg-body { align-items: flex-end; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.7;
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, rgba(124,106,247,0.15), rgba(167,139,250,0.08));
      border: 1px solid rgba(124,106,247,0.22);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }

    .message.ai .bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble-time {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
      font-style: italic;
      padding: 0 2px;
    }

    .message.user .bubble-time { text-align: right; }

    .typing-bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); background: var(--text-dim); }
      30% { transform: translateY(-5px); background: var(--accent2); }
    }

    /* ── INPUT AREA ── */
    .input-area {
      padding: 14px 16px 18px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,106,247,0.08);
    }

    #user-input {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      max-height: 140px;
      min-height: 22px;
      height: 22px;
      overflow-y: auto;
    }

    #user-input::placeholder { color: var(--text-dim); }
    #user-input::-webkit-scrollbar { width: 0; }

    #send-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      color: white;
    }

    #send-btn:hover { background: var(--accent2); transform: scale(1.05); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .input-hint {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 7px;
      padding: 0 2px;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-dim);
      font-family: 'Syne', sans-serif;
      pointer-events: none;
      user-select: none;
    }

    .empty-icon { font-size: 30px; opacity: 0.35; }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--text-muted); }
    .empty-sub { font-size: 12px; font-family: 'DM Mono', monospace; font-weight: 300; text-align: center; }

    /* ── RECALL BAR ── */
    .recall-bar {
      margin-top: 5px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(124,106,247,0.18);
      background: rgba(8,8,18,0.7);
      overflow: hidden;
      animation: fadeSlideIn 0.4s ease forwards;
    }

    .recall-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 10px;
      color: #9a8bff;
      user-select: none;
      transition: background 0.15s;
      letter-spacing: 0.3px;
    }

    .recall-header:hover { background: rgba(124,106,247,0.1); }

    .recall-pulse {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      animation: memPulse 1.5s ease-in-out infinite;
    }

    .recall-label { font-weight: 400; }

    .recall-time {
      color: var(--text-dim);
      font-size: 9px;
      margin-left: 2px;
    }

    .recall-chevron {
      margin-left: auto;
      color: var(--text-dim);
      font-size: 10px;
      transition: transform 0.2s;
      line-height: 1;
    }

    .recall-bar.open .recall-chevron { transform: rotate(180deg); }

    .recall-body {
      display: none;
      flex-direction: column;
      gap: 4px;
      padding: 8px 10px;
      border-top: 1px solid rgba(124,106,247,0.1);
      max-height: 220px;
      overflow-y: auto;
    }

    .recall-body::-webkit-scrollbar { width: 2px; }
    .recall-body::-webkit-scrollbar-thumb { background: var(--border); }

    .recall-bar.open .recall-body { display: flex; }

    .recall-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 6px;
      align-items: start;
      font-size: 10px;
      line-height: 1.4;
      padding: 5px 7px;
      border-radius: 4px;
      background: var(--surface);
      border-left: 2px solid var(--text-dim);
    }

    .recall-item[data-role="user"]      { border-left-color: #5a72cc; }
    .recall-item[data-role="assistant"] { border-left-color: var(--accent); }

    .recall-role {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      padding-top: 1px;
      white-space: nowrap;
    }

    .recall-text {
      color: var(--text-muted);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .recall-ts {
      font-size: 8px;
      color: var(--text-dim);
      white-space: nowrap;
      padding-top: 1px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      :root { --sidebar-w: 80vw; }

      /* on mobile, sidebar slides over the top */
      .sidebar {
        position: fixed;
        top: 0; left: 0;
        height: 100%;
        z-index: 20;
      }

      /* overlay to close sidebar by tapping outside */
      .sidebar-overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 19;
        opacity: 1;
        transition: opacity 0.25s;
      }

      .sidebar.collapsed + .sidebar-overlay,
      .sidebar-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .toggle-btn { z-index: 21; }
      .topbar { z-index: 21; position: relative; }
    }

    /* hide overlay on desktop */
    .sidebar-overlay { display: none; }
  </style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar collapsed" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-dot"></div>
        Continuity
      </div>
      <div class="logo-sub">temporal memory engine</div>
      <div class="btn-row">
        <button class="new-chat-btn" id="new-chat-btn">+ new chat</button>
        <button class="clear-btn" id="clear-btn">⌫ clear all</button>
      </div>
    </div>

    <div class="sidebar-body">
      <div class="sidebar-section">
        <div class="section-label">Memory Summary</div>
        <div id="summary-container">
          <div class="empty-summary">No memory yet — start talking.</div>
        </div>
      </div>

      <div class="context-section">
        <div class="section-label">Last Retrieved</div>
        <div id="context-container">
          <div class="empty-summary">Context will appear here.</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- mobile overlay (tap to close sidebar) -->
  <div class="sidebar-overlay hidden" id="sidebar-overlay"></div>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <button class="toggle-btn" id="toggle-btn" title="Toggle sidebar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="topbar-title">Chat</div>
      <div class="memory-indicator" id="mem-indicator">
        <div class="memory-dot"></div>
        <span id="mem-text" class="mem-label">Ready</span>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🧠</div>
        <div class="empty-title">Continuity Engine</div>
        <div class="empty-sub">Every message remembered.<br>Every pattern tracked.</div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea
          id="user-input"
          placeholder="Say something..."
          rows="1"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button id="send-btn" title="Send (Enter)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </main>

</div>

<script>
  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('user-input');
  const sendBtn      = document.getElementById('send-btn');
  const memIndicator = document.getElementById('mem-indicator');
  const memText      = document.getElementById('mem-text');
  const summaryEl    = document.getElementById('summary-container');
  const contextEl    = document.getElementById('context-container');
  const emptyState   = document.getElementById('empty-state');
  const sidebar      = document.getElementById('sidebar');
  const toggleBtn    = document.getElementById('toggle-btn');
  const clearBtn     = document.getElementById('clear-btn');
  const newChatBtn   = document.getElementById('new-chat-btn');
  const overlay      = document.getElementById('sidebar-overlay');

  let isLoading = false;
  const isMobile = () => window.innerWidth <= 640;

  /* ── SIDEBAR TOGGLE ── */
  function openSidebar() {
    sidebar.classList.remove('collapsed');
    overlay.classList.remove('hidden');
  }

  function closeSidebar() {
    sidebar.classList.add('collapsed');
    overlay.classList.add('hidden');
  }

  /* desktop: open by default */
  if (!isMobile()) openSidebar();

  toggleBtn.addEventListener('click', () => {
    if (sidebar.classList.contains('collapsed')) {
      openSidebar();
    } else {
      closeSidebar();
    }
  });

  /* tap outside on mobile closes sidebar */
  overlay.addEventListener('click', closeSidebar);

  /* ── AUTO-RESIZE TEXTAREA ── */
  function resizeInput() {
    inputEl.style.height = '22px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }

  inputEl.addEventListener('input', resizeInput);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  /* ── MEMORY INDICATOR ── */
  let doneTimer = null;
  function setMemoryState(state) {
    clearTimeout(doneTimer);
    memIndicator.className = 'memory-indicator ' + state;
    if (state === 'loading') memText.textContent = 'Retrieving...';
    else if (state === 'done') {
      memText.textContent = 'Retrieved';
      doneTimer = setTimeout(() => setMemoryState(''), 2500);
    } else {
      memText.textContent = 'Ready';
    }
  }

  /* ── ADD MESSAGE ── */
  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function buildRecallBar(contextItems, recallMs) {
    const secs = (recallMs / 1000).toFixed(1);
    const timeLabel = recallMs < 1000 ? recallMs + 'ms' : secs + 's';

    const bar = document.createElement('div');
    bar.className = 'recall-bar';

    const header = document.createElement('div');
    header.className = 'recall-header';
    header.innerHTML =
      '<div class="recall-pulse"></div>' +
      '<span class="recall-label">Remembering</span>' +
      '<span class="recall-time">· recalled in ' + timeLabel + '</span>' +
      '<span class="recall-chevron">▾</span>';

    const body = document.createElement('div');
    body.className = 'recall-body';

    contextItems.forEach(item => {
      const row = document.createElement('div');
      row.className = 'recall-item';
      row.dataset.role = item.role;

      const ts   = (item.timestamp || '').replace('T', ' ').slice(0, 16);
      const role = document.createElement('span');
      role.className = 'recall-role';
      role.textContent = item.role === 'user' ? 'you' : 'cogen';

      const text = document.createElement('span');
      text.className = 'recall-text';
      text.textContent = item.content;

      const tsEl = document.createElement('span');
      tsEl.className = 'recall-ts';
      tsEl.textContent = ts;

      row.appendChild(role);
      row.appendChild(text);
      row.appendChild(tsEl);
      body.appendChild(row);
    });

    header.addEventListener('click', () => bar.classList.toggle('open'));

    bar.appendChild(header);
    bar.appendChild(body);
    return bar;
  }

  function addMessage(role, content, recallData) {
    emptyState.style.display = 'none';

    const msg    = document.createElement('div');
    msg.className = `message ${role}`;

    const avatar  = document.createElement('div');
    avatar.className = `avatar ${role === 'user' ? 'user-av' : 'ai-av'}`;
    avatar.textContent = role === 'user' ? 'U' : '◈';

    const body   = document.createElement('div');
    body.className = 'msg-body';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;

    const time   = document.createElement('div');
    time.className = 'bubble-time';
    time.textContent = getTime();

    body.appendChild(bubble);
    body.appendChild(time);

    if (role === 'ai' && recallData && recallData.context && recallData.context.length > 0) {
      body.appendChild(buildRecallBar(recallData.context, recallData.recallMs || 0));
    }

    msg.appendChild(avatar);
    msg.appendChild(body);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTypingIndicator() {
    const msg    = document.createElement('div');
    msg.className = 'message ai';
    msg.id       = 'typing';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai-av';
    avatar.textContent = '◈';

    const body   = document.createElement('div');
    body.className = 'msg-body';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

    body.appendChild(bubble);
    msg.appendChild(avatar);
    msg.appendChild(body);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  /* ── UPDATE SIDEBAR ── */
  function updateSummary(lines) {
    summaryEl.innerHTML = '';
    if (!lines || !lines.length) {
      summaryEl.innerHTML = '<div class="empty-summary">No memory yet.</div>';
      return;
    }
    lines.forEach((line, i) => {
      const d = document.createElement('div');
      d.className = 'summary-item';
      d.style.animationDelay = (i * 0.05) + 's';
      d.textContent = line;
      summaryEl.appendChild(d);
    });
  }

  function updateContext(items) {
    contextEl.innerHTML = '';
    if (!items || !items.length) {
      contextEl.innerHTML = '<div class="empty-summary">No context retrieved.</div>';
      return;
    }
    items.slice(0, 5).forEach((item, i) => {
      const el   = document.createElement('div');
      el.className = 'context-item';
      el.style.animationDelay = (i * 0.04) + 's';

      const imp  = item.importance || 1;
      el.dataset.importance = imp >= 6 ? 'high' : imp >= 3 ? 'mid' : 'low';

      const meta = document.createElement('div');
      meta.className = 'context-meta';

      const mkTag = (cls, text) => {
        const s = document.createElement('span');
        s.className = 'tag ' + cls;
        s.textContent = text;
        return s;
      };

      const emo = item.emotion || 'neutral';
      meta.appendChild(mkTag('role-' + item.role, item.role));
      meta.appendChild(mkTag('emotion-' + emo, emo));
      meta.appendChild(mkTag('', '★' + imp));

      const content = document.createElement('div');
      content.className = 'context-content';
      content.textContent = item.content;

      el.appendChild(meta);
      el.appendChild(content);
      contextEl.appendChild(el);
    });
  }

  /* ── NEW CHAT (clears UI only — memory persists) ── */
  newChatBtn.addEventListener('click', () => {
    messagesEl.innerHTML = '';
    emptyState.style.display = '';
    messagesEl.appendChild(emptyState);
    contextEl.innerHTML = '<div class="empty-summary">Context will appear here.</div>';
  });

  /* ── CLEAR ALL MEMORY ── */
  clearBtn.addEventListener('click', async () => {
    if (!confirm('Wipe all memory permanently? This cannot be undone.')) return;
    try {
      await fetch('/clear', { method: 'POST' });
    } catch (e) { /* silent */ }
    summaryEl.innerHTML  = '<div class="empty-summary">No memory yet — start talking.</div>';
    contextEl.innerHTML  = '<div class="empty-summary">Context will appear here.</div>';
    messagesEl.innerHTML = '';
    emptyState.style.display = '';
    messagesEl.appendChild(emptyState);
  });

  /* ── SEND MESSAGE ── */
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = '22px';

    addMessage('user', text);
    setMemoryState('loading');

    const typingTimer = setTimeout(addTypingIndicator, 500);

    try {
      const res  = await fetch('/chat', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ message: text })
      });

      if (!res.ok) throw new Error('Server error ' + res.status);

      const data = await res.json();
      clearTimeout(typingTimer);
      removeTypingIndicator();
      setMemoryState('done');
      addMessage('ai', data.response || '[No response]', {
        context:  data.context,
        recallMs: data.recall_ms,
      });
      updateSummary(data.summary);
      updateContext(data.context);

    } catch (err) {
      clearTimeout(typingTimer);
      removeTypingIndicator();
      setMemoryState('');
      addMessage('ai', '[Error: ' + err.message + ']');
    }

    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
